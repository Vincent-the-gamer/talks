[build]
publish = "dist"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "24"

[[redirects]]
from = "/.well-known/*"
to = "/.well-known/:splat"
status = 200

[[redirects]]
from = "/2026-10-11"
to = "/2026/arm-your-agent/"
status = 301

[[redirects]]
from = "/2026/arm-your-agent/*"
to = "/2026/arm-your-agent/index.html"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
